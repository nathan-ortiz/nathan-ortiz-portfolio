<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: "Source Sans 3", sans-serif; }
  img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,25,28,.14) 0%, rgba(10,25,28,.68) 82%); }
  .content { position: absolute; left: 64px; right: 64px; bottom: 56px; color: #fff; }
  .kicker { font-size: 21px; font-weight: 700; letter-spacing: .16em; color: #9CD4CE; margin-bottom: 14px; }
  h1 { font-family: "Zilla Slab", serif; font-size: 66px; line-height: 1.12; font-weight: 700; text-shadow: 0 2px 26px rgba(10,25,28,.6); }
  .rule { display: flex; align-items: center; gap: 18px; margin-top: 26px; font-size: 24px; font-weight: 600; color: #ECF3F1; }
  .rule .stars { color: #F4C95D; letter-spacing: .1em; }
  .brand { position: absolute; top: 48px; left: 64px; font-family: "Zilla Slab", serif; font-size: 34px; font-weight: 700; color: #fff; text-shadow: 0 2px 14px rgba(10,25,28,.55); }
  .brand span { color: #7FC9C2; }
</style>
</head>
<body>
  <img class="bg" src="../img/hero-cove.jpg">
  <div class="scrim"></div>
  <div class="brand">Kayak <span>Mendocino</span></div>
  <div class="content">
    <div class="kicker">VAN DAMME STATE PARK · MENDOCINO COAST</div>
    <h1>The sea carved the cathedral.<br>You paddle in.</h1>
    <div class="rule"><span class="stars">★★★★★</span><span>Guided sea cave tours · Ages 4 and up · No experience needed</span></div>
  </div>
</body>
</html>
