<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Inter:wght@600;700&display=swap" />
<style>
  :root{
    --paper:#FBF7EE; --paper-2:#F4EBD6;
    --ink:#1A1814; --ink-muted:#5B544A;
    --navy:#0c3c78; --navy-deep:#082a55;
    --lake:#54c0e4; --lake-deep:#3c84cc; --rule:#D9CFB6;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    width:1200px; height:630px;
    background:var(--paper);
    font-family:'Fraunces', serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    position:relative;
    background-image:
      radial-gradient(900px 600px at 12% 0%, rgba(84,192,228,0.10), transparent 60%),
      radial-gradient(900px 500px at 95% 100%, rgba(12,60,120,0.08), transparent 65%);
  }
  body::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    opacity:0.55; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.06 0 0 0 0 0.05 0 0 0 0 0.03 0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .frame{
    position:relative; z-index:1;
    width:100%; height:100%;
    padding:48px 80px 52px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .top{ display:flex; align-items:center; gap:18px; }
  .logo{
    width:64px; height:64px;
    background:url('assets/logo.webp') center/contain no-repeat;
    flex:0 0 64px;
  }
  .top__label{
    font-family:'Inter', sans-serif;
    font-weight:700; font-size:14px;
    letter-spacing:0.22em; text-transform:uppercase;
    color:var(--lake-deep);
  }
  .top__bar{
    flex:1; height:1px; background:var(--rule);
  }
  .top__date{
    font-family:'Inter', sans-serif;
    font-weight:600; font-size:13px;
    letter-spacing:0.18em; text-transform:uppercase;
    color:var(--ink-muted);
  }

  .mid{ padding-top:18px; }
  .kicker{
    font-family:'Inter', sans-serif;
    font-weight:600; font-size:15px;
    letter-spacing:0.22em; text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 18px;
  }
  h1{
    font-family:'Archivo Black', sans-serif;
    color:var(--navy);
    font-size:94px;
    line-height:0.96;
    letter-spacing:-0.025em;
    margin:0 0 22px;
    font-weight:400;
  }
  .sub{
    font-family:'Fraunces', serif;
    font-style:italic; font-weight:500;
    font-size:26px; line-height:1.3;
    color:var(--ink);
    max-width:880px;
    margin:0;
  }

  .bot{
    display:flex; align-items:center; justify-content:space-between;
    gap:24px;
  }
  .byline{
    font-family:'Inter', sans-serif;
    font-weight:700; font-size:15px;
    letter-spacing:0.18em; text-transform:uppercase;
    color:var(--navy);
  }
  .byline span{ color:var(--ink-muted); margin-left:14px; font-weight:500; }
  .dot{ color:var(--lake-deep); margin:0 6px; }
  .url{
    font-family:'Inter', sans-serif;
    font-weight:600; font-size:14px;
    letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-muted);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="logo" aria-hidden="true"></div>
      <span class="top__label">A Proposal For Disney's Boat Rentals</span>
      <span class="top__bar"></span>
      <span class="top__date">Summer 2026</span>
    </div>

    <div class="mid">
      <p class="kicker">For Brandon &amp; Connor Disney</p>
      <h1>Fixing a few things<br/>on your website.</h1>
      <p class="sub">A short read on what's costing you bookings this summer, and what I'd do about it. Trade for time on the water.</p>
    </div>

    <div class="bot">
      <span class="byline">Nathan Ortiz <span>Software developer · Ukiah, CA</span></span>
      <span class="url">nathanortiz.com/disneys</span>
    </div>
  </div>
</body>
</html>
