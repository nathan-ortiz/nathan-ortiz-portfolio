<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card — Captain Kirk's</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..650;1,9..144,400..650&family=Inter:wght@400..750&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: "Inter", sans-serif; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(13,33,43,0.92) 0%, rgba(13,33,43,0.42) 55%, rgba(13,33,43,0.25) 100%); }
  .content { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; justify-content: flex-end; color: #FDFDFB; }
  .kirk { font-size: 20px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #E4B95E; margin-bottom: 10px; }
  h1 { font-family: "Fraunces", serif; font-weight: 560; font-size: 76px; line-height: 1.04; letter-spacing: -0.01em; margin-bottom: 22px; max-width: 900px; }
  .sub { font-size: 27px; color: rgba(253,253,251,0.92); margin-bottom: 26px; }
  .row { display: flex; gap: 36px; align-items: baseline; font-size: 22px; color: rgba(253,253,251,0.85); }
  .row strong { color: #E4B95E; font-weight: 700; }
</style>
</head>
<body>
  <img class="bg" src="assets/hero-goldengate.jpg" alt="">
  <div class="scrim"></div>
  <div class="content">
    <div class="kirk">Captain Kirk's San Francisco Sailing</div>
    <h1>The Bay is best under sail.</h1>
    <div class="sub">Private charters under the Golden Gate · Sausalito &amp; San Francisco</div>
    <div class="row">
      <span><strong>★ 5.0</strong> · 1,100+ reviews</span>
      <span><strong>#1</strong> of 42 things to do in Sausalito</span>
      <span>Est. <strong>2002</strong></span>
    </div>
  </div>
</body>
</html>
